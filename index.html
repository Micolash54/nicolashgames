---
layout: main
---
{% for post in paginator.posts %}
<article class="post">
  {% if post.img %}
    <a class="post-thumbnail" style="background-image: url({{ post.img | prepend: '/assets/img' | relative_url }})" href="{{post.url | prepend: site.baseurl}}"></a>
  {% else %}
  {% endif %}
  <div class="post-content">
    <h2 class="post-title"><a href="{{post.url | prepend: site.baseurl}}">{{post.title}}</a></h2>
    <p>{{ post.description | strip_html | truncatewords: 30 }}</p>
    <!-- <span class="post-date">{{post.date | date: '%Y, %b %d'}}&nbsp;&nbsp;&nbsp;—&nbsp;</span> -->
    <!-- <span class="post-words">{% capture words %}{{ post.content | number_of_words }}{% endcapture %}{% unless words contains "-" %}{{ words | plus: 250 | divided_by: 250 | append: " minute read" }}{% endunless %}</span> -->
    <div class="page-tag">
      {% for tag in post.tags limit:3 %}
        <span class="tag tag-{{ tag | slugify }}">&#35; {{ tag }}</span>
      {% endfor %}
    </div>
  </div>
</article>
{% endfor %}

{% include pagination.html %}
