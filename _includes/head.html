<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  {% assign meta_description = page.description | default: site.description %}
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ meta_description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ meta_description | strip_html | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {% if page.img %}
  <meta property="og:image" content="{{ page.img | prepend: '/assets/img' | absolute_url }}">
  {% else %}
  <meta property="og:image" content="{{ '/assets/img/Logo 1024.jpg' | absolute_url }}">
  {% endif %}
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ '/assets/img/favicon/favicon.ico' | relative_url }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ '/assets/img/favicon/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% if page.layout == 'shop' %}<link rel="stylesheet" href="{{ '/assets/css/shop.css' | relative_url }}">{% endif %}
</head>
